  8. 涉及资本开支、支付税费、折旧、摊销、费用压力、现金流出等字段时，优先使用 Abs() 统一符号口径。
  9. 比率分母优先使用收入、总资产、净资产等规模锚；严禁把净利润、营业利润、经营现金流作为通用分母。
  10. 这里首要冲击的是正向财务 Alpha：默认高值组应该代表更好的公司；只有明确风险/排雷因子才允许强化低值组或负向尾部。
