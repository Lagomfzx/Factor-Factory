  | **Reversal_Power** | `rank(ts_argmax(signedpower(ts_rank(close, 10), 2.0), 5))` | 复杂反转：寻找过去10天价格排名的极值点，利用 SignedPower 放大信号，最后全市场排名。 |
  | **Liquid_Squeeze** | `(-1 * rank(covariance(rank(high), rank(vol), 5)))` | 拥挤交易：高价与放量的协方差排名取反，做空高位放量的拥挤股票 (参考 Alpha#15)。 |
  | **Vol_Price_Div** | `rank(correlation(delay(close - open, 1), close, 20))` | 量价相关：昨日K线实体与今日收盘价的滚动相关性 (参考 Alpha#37)。 |
