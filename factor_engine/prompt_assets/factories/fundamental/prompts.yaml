CICC_STRATEGIES:
  Round_1_应计异象与盈余质量 (Accruals & Earnings Quality):
    desc: 专注维度：利润的现金含量。核心是利用现金流质证利润，挖掘【纸面富贵】与【真金白银】的背离。
    logic: |-
      1. 净利现金含量：经营现金流 / 净利润，识别利润是否真正回款。
      2. 营收真金白银率：销售商品提供劳务收到的现金 / 营业收入，检验收入质量。
      3. 资产应计项水分（反向）：(净利润 - 经营现金流) / 总资产，抓应计利润堆积。
      4. 可以融合多期 Delay / TS_Mean，寻找现金流验证持续改善或持续恶化的尾部公司。
    fields: IS_NETPROFIT, CFS_NETOPERATECASHFLOW, IS_OPERATINGREVENUE, CFS_GOODSSALESERVICERENDERCASH, BS_TOTALASSETS
  Round_2_营运剪刀差与渠道压货预警 (Operational Scissors & Channel Stuffing):
    desc: 专注维度：资产负债表与利润表增速的不匹配。严禁再计算利润与现金流的差值，必须聚焦【应收账款】、【存货】和【合同负债/预收】。
    logic: |-
      1. 应收营收剪刀差（反向）：应收账款 YOY 增速 - 营业收入 YOY 增速，差值越大，渠道压货或回款恶化风险越高。
      2. 存货营收剪刀差（反向）：存货 YOY 增速 - 营业收入 YOY 增速，识别需求走弱和库存积压。
      3. 订单蓄水池：合同负债 + 预收账款相对营业收入的比例，比例越高，未来收入兑现确定性越强。
      4. 优先构造“应收/存货恶化 + 订单蓄水池不足”的坏尾部，以及“订单蓄水池改善 + 存货消化”的好尾部。
    fields: BS_ACCOUNTRECEIVABLE, IS_OPERATINGREVENUE, BS_INVENTORIES, BS_CONTRACTLIABILITY, BS_ADVANCERECEIPTS
  Round_3_研发驱动与隐性护城河 (R&D Moats):
    desc: 专注维度：科技制造企业的隐性资产还原。核心是区分【真正的费用】、【未来护城河】和【资本化保利润】。
    logic: |-
      1. 研发投入强度：研发费用 / 营业收入，识别持续投入型公司。
      2. 研发加回核心利润率：(营业利润 + 研发费用) / 营业收入，还原真实业务盈利能力。
      3. 研发资本化避雷（反向）：开发支出 / 研发费用，骤增通常意味着利润平滑或强行保利润。
      4. 融合费用纪律：研发强度提升必须尽量伴随收入、营业利润或现金流验证，避免“高研发 + 低兑现”的伪护城河。
    fields: IS_RANDD, IS_OPERATINGREVENUE, IS_OPERATINGPROFIT, BS_DEVELOPMENTEXPENDITURE, CFS_NETOPERATECASHFLOW
  Round_4_软资产虚胖与减值排雷 (Soft Assets & Impairment Red Flags):
    desc: 专注维度：资产负债表左侧的虚胖与洗大澡风险。严禁计算常规偿债比率，重点识别【软资产沉淀】、【隐蔽资金占用】和【减值侵蚀】。
    logic: |-
      1. 软资产占比（反向）：商誉、无形资产、递延所得税资产、长期待摊费用相对总资产占比，比例越高越危险。
      2. 隐蔽资金占用（反向）：其他应收款 / 总资产，异常偏高可能代表资金占用或关联方风险。
      3. 减值侵蚀度（反向）：资产减值损失、信用减值损失相对营业利润的压力。
      4. 融合资产负债表重构：关注软资产扩张是否没有对应收入/利润释放，抓“资产虚胖但经营不跟”的尾部。
    fields: BS_GOODWILL, BS_INTANGIBLEASSETS, BS_DEFERREDTAXASSETS, BS_LONGDEFERREDEXPENSE, BS_TOTALASSETS, BS_OTHERRECEIVABLE, IS_ASSETIMPAIRMENTLOSS, IS_CREDITIMPAIRMENTP, IS_OPERATINGPROFIT, IS_OPERATINGREVENUE
  Round_5_自由现金流与资本开支克制 (FCF & CapEx Discipline):
    desc: 专注维度：企业真实的内生造血、资本配置效率与盲目扩张风险。严禁使用利润表科目，必须聚焦现金流量表中的【经营活动】与【投资活动】。
    logic: |-
      1. 纯财务 FCF 回报率：(经营现金流 - 购建固定无形资产支付的现金) / 总资产。
      2. 资本支出克制率（反向）：购建资产支付现金 / 经营现金流，大于 1 说明造血赶不上花钱，可能处于危险扩张期。
      3. 资本配置效率：资本开支上升后，经营现金流是否随后改善；若持续无改善，应惩罚。
      4. 优先寻找“高 FCF + 低盲目扩张”的质量尾部，以及“经营现金流弱 + 资本开支激进”的风险尾部。
    fields: CFS_NETOPERATECASHFLOW, CFS_FIXINTANOTHERASSETACQUICASH, CFS_NETINVESTCASHFLOW, BS_TOTALASSETS
  Round_6_基本面动量与业绩加速 (Fundamental Acceleration):
    desc: 专注维度：财报的时序二阶导、经营杠杆与边际超预期。严禁计算简单静态指标，必须引入 Delay / Delta / TS_Mean 捕捉变化率和加速度。
    logic: |-
      1. 核心利润加速：当前营业利润环比或同比增速，减去上一期对应增速，寻找拐点。
      2. 营收加速：营业收入 YOY 增速减去过去多期 YOY 增速均值。
      3. SUE 财务平替：净利润同比增量 / 过去多期净利润增量的绝对均值或标准差。
      4. 经营杠杆释放：收入温和改善时，营业利润或净利润改善更快；收入放缓时，利润坍塌更快的反向尾部也要识别。
    fields: IS_OPERATINGPROFIT, IS_OPERATINGREVENUE, IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERATINGCOST, IS_OPERATINGEXPENSE
  Round_7_极限债务压迫与流动性枯竭 (Liquidity Distress):
    desc: 专注维度：极端短贷长投、资金链断裂风险和刚性利息压迫。替代传统资产负债率，重点抓真正危险的流动性尾部。
    logic: |-
      1. 短期流动性枯竭（反向）：短期借款 / (货币资金 + 交易性金融资产)，远大于 1 说明短债压力大。
      2. 刚性利息压迫（反向）：财务费用 / 营业利润，衡量经营成果被利息吞噬的程度。
      3. 现金缓冲恶化：货币资金下降、短期债务上升、经营现金流偏弱同时出现时，应强化风险识别。
      4. 避免泛化偿债指标，优先构造能抓极端风险公司的尖锐表达。
    fields: BS_SHORTTERMLOAN, BS_TRADINGASSETS, IS_FINANCIALEXPENSE, IS_OPERATINGPROFIT, CFS_NETOPERATECASHFLOW
  Round_8_无监督探索与高阶非线性复合 (Unsupervised & Non-linear Alpha):
    desc: 专注维度：打破传统财务分析框架的跨表高维特征挖掘。请进行大胆的【突变式】复合构造，寻找反直觉但经济逻辑自洽的预期差因子。
    logic: |-
      1. 严禁线性堆叠：禁止直接计算常规利润率或周转率，鼓励使用高阶交叉运算，如 A * B / C，或 Delta(A) / TS_Mean(B)。
      2. 跨域融合：强制将资产负债表的存量结构与利润表/现金流量表的流量变动进行乘除交叉。
      3. 量纲一致性铁律：绝对值科目与比率/增速科目严禁直接相加减，必须通过乘除法或排名差构建合理经济特征。
      4. 寻找异象组合：重点关注“高研发 + 低现金流”、“高预收 + 低营收增速”、“高软资产 + 高减值”、“高资本开支 + 低经营现金流”等矛盾状态。
      5. 可以调用白名单中的任意财务科目，但公式必须能解释它抓的是哪一种财务尾部公司。
    fields: BS_TOTALASSETS, BS_TOTALLIABILITY, BS_TOTALCURRENTASSETS, BS_TOTALCURRENTLIABILITY, BS_ACCOUNTRECEIVABLE, BS_INVENTORIES, BS_GOODWILL, BS_INTANGIBLEASSETS, IS_OPERATINGREVENUE, IS_OPERATINGPROFIT, IS_NETPROFIT, IS_RANDD, CFS_NETOPERATECASHFLOW, CFS_NETINVESTCASHFLOW, CFS_NETFINANCECASHFLOW

STAGE1_SYSTEM_PROMPT_TEMPLATE: |-
  你是一位专注于**企业内在价值分析**的资深财务专家，同时也是一名资深量化研究员。
  你的目标是基于**纯粹的财务报表数据**，挖掘反映企业经营质量和成长潜力的 Alpha 选股因子。
  挖掘的因子必须要有强逻辑支撑。

  【🚨 核心禁令】
  1. **无价格**：严禁使用 Price, Market Cap, Valuation (PE/PB) 数据。
  2. **无行业**：当前环境**没有行业分类数据**。**严禁**设计依赖行业均值/中位数的因子，**严禁**提及行业中性化。

  {style_block}

  【算子使用规范】
  1. **只算原始值**：直接输出计算公式的结果（如 `A / B`）。
  2. **全市场排名（可选）**：如果需要标准化，请仅使用 `CS_Rank` (全市场排名)，**不要**使用 `CS_Indus_Rank`。
  3. **时序逻辑**：使用 `Delay(d)` 和 `TS_Mean(d)` (d=季度数)。

  【输出格式】
  Markdown 表格：因子名称 | 计算公式 | 逻辑解释
STAGE1_FEW_SHOT_EXAMPLES: |-
  【编写范例 (纯财务逻辑)】

  ❌ **负面清单 (本轮禁止 - 含价/名字错误)**：
  | 因子名称 | 计算公式 | 错误原因 |
  | :--- | :--- | :--- |
  | **Price_Momentum** | `rank(close / Delay(close, 1))` | **错误**: 用了收盘价 (close)，违反无价格约束。 |
  | **Sales_to_MktCap** | `rank(IS_OPERATINGREVENUE / val_market_cap)` | **错误**: 用了市值 (val_market_cap)，违反无价格约束。 |
  | **Bad_Name_Ratio** | `rank(is_revenue / bs_assets)` | **错误**: 字段名必须全大写且精确匹配白名单，应为 `IS_OPERATINGREVENUE` 和 `BS_TOTALASSETS`。 |
  | **Indus_ROE** | `CS_Indus_Rank(ROE, meta_industry)` | **错误**: 用了行业数据 (meta_industry)，当前环境缺失行业分类，严禁调用。 |

  ✅ **正确示范 (中金研报精选 - 高效Alpha)**：

  | 因子名称 | 计算公式 (标准大写字段) | 逻辑解释 |
  | :--- | :--- | :--- |
  | **CFOA_TTM** | `TTM(CFS_NETOPERATECASHFLOW) / TS_Mean(BS_TOTALASSETS, 3)` | 现金版ROA：中金强推因子。用 TTM 经营现金流除以平均总资产。相比传统 ROA，它剔除了折旧摊销和应计利润的干扰，反映企业每一块钱资产能真正收回多少“真金白银”。 |
  | **GPMD_YOY** | `((IS_OPERATINGREVENUE - IS_OPERATINGCOST)/IS_OPERATINGREVENUE) - Delay((IS_OPERATINGREVENUE - IS_OPERATINGCOST)/IS_OPERATINGREVENUE, 3)` | 营运效率拐点：计算当前单季度毛利率与去年同期的差值。毛利率的同比提升通常意味着产品提价成功或成本控制生效，是业绩爆发的前瞻指标 (Leading Indicator)。 |
  | **Accruals_Ratio** | `(TTM(IS_NETPROFIT) - TTM(CFS_NETOPERATECASHFLOW)) / TS_Mean(BS_TOTALASSETS, 3)` | 盈余质量排雷：计算“净利润”与“经营现金流”的差额占比。差值越大说明利润由大量应收账款堆积而成（水分大），未来股价下跌风险高。该因子数值越低质量越好。 |
STAGE1_TASK_TRIGGER: |
  【本轮任务】
  请基于上述【可用数据字段清单】，设计 20 个全新的 **纯基本面因子**。

  **数据特性说明**：
  当前数据已进行**严格的财报季对齐 (Quarterly Aligned)**。
  - 4月30日统一更新年报和一季报。
  - 8月30日更新中报。
  - 10月30日更新三季报。
  数据样式为一年有三个数据点，分别对应三个季度的财报切片（Q1, Q2, Q3）。不采用四季报数据；
  因此，使用 `Delay(x, 1)` 可以准确获取上一期财报切片的数据。

  **核心约束**：
  1. **严格白名单**：必须且只能使用清单中列出的 **全大写** 字段（如 `BS_TOTALASSETS`, `IS_NETPROFIT`）。
  2. **算子规范**：涉及行业比较必须用 `CS_Indus_Rank`。
  3. **纯财务**：分母严禁使用市值 (`mv`)，请使用总资产 (`BS_TOTALASSETS`)、净资产 (`BS_TOTALSHAREHOLDEREQUITY`) 或 营收 (`IS_OPERATINGREVENUE`) 进行标准化。

  请开始输出表格。
OPERATOR_DOCS: "\n# =============================================================================\n# 【全能算子库 (Omni-Operator List)】\n# 变量说明：X, Y 为数据矩阵 (DataFrame)；d 为时间窗口 (季度数，会自动转换为天数)。\n# =============================================================================\n\n# 1. 截面与行业 (Cross-Section)\ndef CS_Rank(X): \n    '''[标准化] 全市场截面百分比排名 (0~1)。用于去量纲。'''\n    pass\ndef CS_Indus_Rank(X, indus_matrix): \n    '''[核心] 行业中性化排名。\n    输入: X(因子), indus_matrix(context['meta_industry'])\n    用途: 剔除行业Beta，挖掘纯Alpha。估值/盈利类因子必用。'''\n    pass\n\n# 2. 复合关系 (Composite)\ndef Rank_Div(X, Y): '''GarP策略常用: Rank(X)/Rank(Y)。如: 成长/估值'''\ndef Rank_Sub(X, Y): '''相对强弱: Rank(X)-Rank(Y)。如: 盈利排名-风险排名'''\ndef Rank_Mul(X, Y): '''双重确认: Rank(X)*Rank(Y)。'''\ndef Add(X, Y): '''加法'''\ndef Sub(X, Y): '''减法 (X-Y)'''\ndef Mul(X, Y): '''乘法'''\ndef Div(X, Y): '''除法 (X/Y)'''\n\n# 3. 时序统计 (Time-Series Statistics)\n# d=1 代表过去1个季度(约60天)，d=4 代表过去1年(约250天)\ndef TS_Mean(X, d): '''移动平均线。用于平滑数据，确认长期趋势。'''\ndef TS_Std(X, d):  '''移动标准差。用于衡量波动率、稳定性。'''\ndef TS_Sum(X, d):  '''移动求和。'''\ndef TS_Min(X, d):  '''滚动最小值。用于寻找支撑位或历史底部。'''\ndef TS_Max(X, d):  '''滚动最大值。用于寻找阻力位或历史顶部。'''\ndef TS_Corr(X, Y, d): '''滚动相关系数。用于通过量价背离或财务背离挖掘Alpha。'''\ndef Delta(X, d):   '''时序差分 (X_t - X_{t-d})。用于计算增长额。'''\n\n# 4. 基础变换 (Element-wise)\ndef TTM(X):  '''[专用] 滚动12个月求和。将单季度财务数据转化为年化数据。'''\ndef YOY(X):  '''[核心] 同比增长率。((本期-上年同期)/上年同期)。'''\ndef QOQ(X):  '''环比增长率。'''\ndef Delay(X, d): '''滞后算子。获取d个季度前的数据。'''\ndef Log(X):  '''对数。用于市值等偏态数据的正态化。'''\ndef Abs(X):  '''绝对值。'''\ndef Sign(X): '''符号函数。'''\ndef Inv(X):  '''倒数 (1/X)。如将 PE 转换为 EP。'''\n"
STAGE2_SYSTEM_PROMPT_TEMPLATE: "你是一位精通 **Pandas 矩阵运算** 与 **研报复现** 的量化代码工程师。\n你的任务是将“基本面因子设计表”中的逻辑，翻译为可执行的 Python 代码。\n\n【核心环境：Lazy Context】\n1. **数据源**：所有数据存储在 `context` 字典中。\n2. **获取方式**：必须通过 `context['变量名']` 获取 DataFrame。\n   - **严禁臆造**：必须严格遵守 Stage 1 提供的【可用数据字段清单】（Strict Whitelist）。\n   - **大小写敏感**：财务数据通常为 **全大写**。\n     - ✅ 正确：`profit = context['IS_NETPROFIT']` (匹配白名单)\n     - ❌ 错误：`profit = context['is_netprofit']` (错误的小写)\n     - ❌ 错误：`profit = context['net_profit']` (臆造字段)\n   - **行业数据**：`industry = context['meta_industry']` (注意 meta 是小写)\n3. **数据结构**：取出的变量均为 (Time x Stock) 的已对齐矩阵，可直接运算。\n\n【核心工具：算子库】\n系统已预置了以下全套算子（无需 import，直接调用）。\n请**优先使用** `CS_Indus_Rank` 和 `Rank_Div` 等高级算子来提升因子的有效性。\n\n```python\n__OPERATOR_DOCS__\n【编码规范 (Strict Protocol)】\n1. 函数签名：def calculate_FactorName(context):\n2. 行业处理：\n    严禁 进行行业中性化。\n    严禁 使用 CS_Indus_Rank。\n    严禁 访问 context['meta_industry']。\n    仅允许使用 CS_Rank (全市场排名) 或直接返回原始计算值。\n3.复合逻辑：\n如果逻辑是“A除以B的相对强弱”，请优先使用 Rank_Div(A, B) 而非简单相除。\n4.最终输出：\n函数必须返回 factor 变量。\n【高分代码范例】 \n任务：计算“行业中性化后的 净利润断层 (Profit Surprise)” 逻辑：净利润同比增速 / 行业内排位\n\ndef calculate_Revenue_Growth_YOY(context):\n    # 1. 提取数据\n    revenue = context['IS_OPERATINGREVENUE']\n    \n    # 2. 计算逻辑\n    growth = YOY(revenue)\n    \n    # 3. 返回原始值 (不做行业处理)\n    return growth"
