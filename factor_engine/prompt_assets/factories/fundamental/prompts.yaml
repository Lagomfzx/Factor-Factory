  # 1. 截面
  def CS_Rank(X):
      '''全市场截面百分比排名 (0~1)。用于去量纲；当前无行业数据，不允许行业中性化。'''
      pass

  # 2. 复合关系
  def Rank_Add(X, Y): '''Rank(X)+Rank(Y)。只用于同一财务现象下的双重确认。'''
  def Rank_Sub(X, Y): '''Rank(X)-Rank(Y)。用于 A 跑赢 B、增长快于风险扩张等剪刀差。'''
  def Rank_Mul(X, Y): '''Rank(X)*Rank(Y)。用于两个正向信号同时确认。'''
  def Rank_Div(X, Y): '''Rank(X)/Rank(Y)。用于相对强弱。'''
  def Add(X, Y): '''加法。'''
  def Sub(X, Y): '''减法 (X-Y)。'''
  def Mul(X, Y): '''乘法。'''
  def Div(X, Y): '''安全除法 X/(Y+EPS)。SUE 和标准化意外必须优先使用。'''

  # 3. 时序统计
  def TS_Mean(X, d): '''移动平均。财务数据过去一年平均通常使用 d=3。'''
  def TS_Std(X, d): '''移动标准差。用于 SUE、历史波动标准化。'''
  def TS_Sum(X, d): '''移动求和。'''
  def TS_Min(X, d): '''滚动最小值。'''
  def TS_Max(X, d): '''滚动最大值。'''
  def TS_Corr(X, Y, d): '''滚动相关系数。'''
  def TS_Rank(X, d): '''当前值在过去 d 个财报切片中的时序分位排名 (0~1)，用于历史高低位置。'''
  def TS_ZScore(X, d): '''当前值相对过去 d 个财报切片均值和波动的标准化偏离。'''
  def TS_RegressionSlope(X, d): '''过去 d 个财报切片的滚动线性回归斜率，用于真实趋势斜率。'''
  def TS_RegressionResidual(X, d): '''当前值相对过去 d 个财报切片线性趋势外推值的残差，用于趋势外超预期。'''
  def TS_Surprise(X, change_d, vol_d): '''财报超预期封装：Delta(TTM(X), change_d) / TS_Std(Delta(TTM(X), change_d), vol_d)。'''
  def Delta(X, d): '''时序差分 X_t - X_{t-d}。'''
  def Slope(X, d): '''TS_RegressionSlope 的别名，过去 d 个财报切片的滚动线性回归斜率。'''

  # 4. 基础变换
  def TTM(X): '''滚动12个月求和。将单季利润表/现金流量表科目转化为 TTM 口径。'''
  def YOY(X): '''同比增长率。'''
  def QOQ(X): '''环比增长率。'''
  def Delay(X, d): '''滞后 d 个财报切片。'''
  def Log(X): '''对数。'''
  def Abs(X): '''绝对值。用于资本开支、税费、折旧摊销、现金流出、费用压力等符号规约。'''
  def Sign(X): '''符号函数。'''
  def Inv(X): '''倒数。'''

