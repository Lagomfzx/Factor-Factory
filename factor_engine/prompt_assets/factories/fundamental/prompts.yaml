CICC_STRATEGIES:
  Round_0_单变量财务动量与修复 (Single Metric Fundamental Momentum):
    desc: 专注维度：最简单、最纯粹的财务变量变化。优先从收入、营业利润、净利润、经营现金流、毛利率、资产周转率等单一口径出发，寻找同一行业内基本面正在改善的公司。
    logic: |-
      1. 收入增长：YOY(IS_OPERATINGREVENUE)，抓需求扩张。
      2. 收入加速度：Delta(YOY(IS_OPERATINGREVENUE), 1)，抓需求边际上修。
      3. 营业利润增长：YOY(IS_OPERATINGPROFIT)，抓核心经营盈利改善。
      4. 营业利润加速度：Delta(YOY(IS_OPERATINGPROFIT), 1)，抓利润边际上修。
      5. 经营现金流增长：YOY(CFS_NETOPERATECASHFLOW)，抓真实造血改善。
      6. 本轮只允许单变量或单一比率的变化口径，禁止复合拼接；目标是寻找最短、最干净的财务 alpha 原型。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGPROFIT, IS_TOTALPROFIT, IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERSUSTNETP, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, IS_INCOMETAXCOST, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, CFS_ALLTAXESPAID, BS_TOTALASSETS, BS_TOTALSHAREHOLDEREQUITY

  Round_1_经典质量口径 (Classic Quality Definitions):
    desc: 专注维度：定义干净、口径稳定、可交易的经典质量因子。优先挖掘毛利率、利润率、资产周转率、ROA/ROE、经营现金流收入比等清晰财务现象，而不是复杂叙事组合。
    logic: |-
      1. 默认解释语境是“同一行业内横截面选股”：同业公司之间，谁的盈利质量、资产效率、现金兑现更好。
      2. 毛利率口径：如 (TTM(IS_OPERATINGREVENUE) - TTM(IS_OPERATINGCOST)) / TTM(IS_OPERATINGREVENUE)，抓同业中的定价权和成本控制。
      3. 利润率口径：如 TTM(IS_OPERATINGPROFIT) / TTM(IS_OPERATINGREVENUE)，抓核心经营利润率；也可使用单季 q 口径观察最新质量。
      4. 周转率口径：如 TTM(IS_OPERATINGREVENUE) / TS_Mean(BS_TOTALASSETS, 3)，抓资产使用效率和轻重资产差异。
      5. 回报率口径：如 TTM(IS_NETPROFIT) / TS_Mean(BS_TOTALASSETS, 3) 或 TTM(IS_NETPROFIT) / TS_Mean(BS_TOTALSHAREHOLDEREQUITY, 3)，抓 ROA/ROE 类质量。
      6. 现金质量口径：如 TTM(CFS_NETOPERATECASHFLOW) / TTM(IS_OPERATINGREVENUE)，抓收入兑现能力，避免 CFO / 净利润这类危险分母。
      7. 本轮禁止过度复合，优先单一财务口径的 q、ttm、delta 版本；每个因子必须说明数值越大对应哪种行业内质量优势。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGPROFIT, IS_NETPROFIT, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, IS_INCOMETAXCOST, CFS_ALLTAXESPAID, BS_TOTALASSETS, BS_TOTALSHAREHOLDEREQUITY

  Round_2_增长修复与负转正 (Growth Repair & Change-to-Zero):
    desc: 专注维度：财报边际修复。挖掘收入、利润、经营现金流、ROE 等从负增长向 0 修复或转正的公司，寻找市场重新定价的“从差到不差”信号。
    logic: |-
      1. 默认解释语境是同一行业内比较：同业公司中，谁的基本面从低谷修复得更快。
      2. 利润增长修复：围绕 YOY(IS_OPERATINGPROFIT)、YOY(IS_NETPROFIT) 的负值收敛、转正、或 Delta(YOY(...), 1) 改善构造。
      3. 收入增长修复：围绕 YOY(IS_OPERATINGREVENUE) 从负增长向 0 或正增长修复，抓需求侧边际改善。
      4. 经营现金流修复：围绕 YOY(CFS_NETOPERATECASHFLOW) 的修复，抓真实造血从差到不差。
      5. ROA/ROE 修复：先构造 TTM(IS_NETPROFIT) / TS_Mean(BS_TOTALASSETS, 3) 或净资产口径，再观察 Delta 或 YOY 变化。
      6. Change-to-zero 的核心不是追逐最高增速，而是抓“历史较差但当前明显修复”的边际预期差；不要硬编码阈值，优先使用 Delta、Abs、Rank_Sub/Rank_Add 等连续表达。
      7. 本轮因子应简单、尖锐，优先单变量增长修复或“增长修复 + 现金确认”双变量结构。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGPROFIT, IS_TOTALPROFIT, IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERSUSTNETP, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, IS_INCOMETAXCOST, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, CFS_ALLTAXESPAID, BS_TOTALASSETS, BS_TOTALSHAREHOLDEREQUITY

  Round_3_基本面加速度 (Fundamental Acceleration):
    desc: 专注维度：增长率的二阶导。挖掘利润、收入、经营现金流、毛利额、ROA/ROE 等基本面指标的加速改善，寻找财报后市场重新定价的边际动量。
    logic: |-
      1. 默认解释语境是同一行业内比较：同业公司中，谁的收入、利润或现金流改善速度正在进一步上修。
      2. 利润加速度：Delta(YOY(IS_OPERATINGPROFIT), 1) 或 Delta(YOY(IS_NETPROFIT), 1)，抓盈利增长继续上修。
      3. 收入加速度：Delta(YOY(IS_OPERATINGREVENUE), 1)，抓需求侧改善是否开始加速。
      4. 毛利额加速度：Delta(YOY(IS_OPERATINGREVENUE - IS_OPERATINGCOST), 1)，抓价格、成本和规模效应共同改善。
      5. 现金流加速度：Delta(YOY(CFS_NETOPERATECASHFLOW), 1) 或 Delta(YOY(CFS_GOODSSALESERVICERENDERCASH), 1)，用现金端确认经营改善。
      6. 如需降低财报切片噪音，可以使用 Delta(TS_Mean(YOY(X), 2), 1)，但不得把加速度磨成普通趋势均值。
      7. 每个因子必须说明它抓的是哪一种二阶导，不要把多个加速度简单平均成泛动量评分。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGPROFIT, IS_TOTALPROFIT, IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, CFS_ALLTAXESPAID, BS_TOTALASSETS

  Round_4_SUE与标准化意外 (SUE & Standardized Fundamental Surprise):
    desc: 专注维度：标准化的财报意外。挖掘当前利润、收入、现金流或回报率变化相对自身历史波动的异常改善，寻找真正超出历史常态的基本面惊喜。
    logic: |-
      1. 默认解释语境是同一行业内比较：不是谁规模更大，而是谁相对自身历史常态出现更强的基本面惊喜。
      2. 净利润 SUE：可用 Div(Delta(TTM(IS_NETPROFIT), 3), TS_Std(Delta(TTM(IS_NETPROFIT), 3), 6)) 近似两年标准化盈利意外。
      3. 营业利润 SUE：对 IS_OPERATINGPROFIT 做同类标准化，减少非经营扰动。
      4. 收入意外：对 TTM(IS_OPERATINGREVENUE) 或 YOY(IS_OPERATINGREVENUE) 的变化做历史波动标准化，抓需求超预期。
      5. 现金流意外：对 CFS_NETOPERATECASHFLOW 的 TTM 增量或 YOY 变化做标准化，抓真实造血超预期。
      6. SUE 类因子必须使用 Div(x, TS_Std(...)) 或历史波动做标准化，避免把大公司绝对增量误判为惊喜；分母要加稳定性思维。
      7. 本轮重点是“相对自身历史的异常改善”，不是简单同比增长。
    fields: IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERATINGPROFIT, IS_TOTALPROFIT, IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_INCOMETAXCOST, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, CFS_ALLTAXESPAID, BS_ACCOUNTRECEIVABLE, BS_INVENTORIES, BS_TOTALASSETS

  Round_5_滚动趋势与持续改善 (Rolling Trend & Persistent Improvement):
    desc: 专注维度：财务指标的持续趋势，而不是单期跳动。挖掘 TTM 利润、收入、现金流、毛利率、资产周转率、ROA/ROE 等指标的滚动改善趋势。
    logic: |-
      1. 默认解释语境是同一行业内比较：同业公司中，谁的改善路径更连续，而不是只靠一季跳动。
      2. 利润趋势：Slope(TTM(IS_NETPROFIT), 4) 或 Slope(TTM(IS_OPERATINGPROFIT), 4)，抓 TTM 盈利的持续上行趋势。
      3. 收入趋势：Slope(TTM(IS_OPERATINGREVENUE), 4)，抓需求和规模的持续改善。
      4. 现金流趋势：Slope(TTM(CFS_NETOPERATECASHFLOW), 4)，抓真实造血趋势。
      5. 质量趋势：先构造毛利率、资产周转率、ROA/ROE、现金流收入比，再使用 Delta 或 Slope 观察持续改善。
      6. 趋势类因子必须区别于单期增长率：它抓的是连续改善的路径，而不是某一期突增。
      7. 若使用 Slope，请确保公式仍然简单；如果不用 Slope，可用 Delta(TS_Mean(X, 3), 1) 近似趋势变化。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGPROFIT, IS_NETPROFIT, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, BS_ACCOUNTRECEIVABLE, BS_INVENTORIES, BS_TOTALASSETS, BS_TOTALSHAREHOLDEREQUITY

  Round_6_现金流确认与应计修正 (Cash Confirmation & Accrual Adjustment):
    desc: 专注维度：收入和利润能否被现金流确认。挖掘销售收现、经营现金流、经营性应收释放、经营性应付支撑等现金确认现象，补充单纯利润和收入因子。
    logic: |-
      1. 默认解释语境是同一行业内比较：同业公司中，谁的收入和利润更能兑现为现金。
      2. 销售收现确认：Rank_Sub(YOY(CFS_GOODSSALESERVICERENDERCASH), YOY(IS_OPERATINGREVENUE))，抓回款增速跑赢收入增速。
      3. 经营现金流收入比：TTM(CFS_NETOPERATECASHFLOW) / TTM(IS_OPERATINGREVENUE)，抓收入现金化能力。
      4. 利润现金确认：Rank_Sub(YOY(CFS_NETOPERATECASHFLOW), YOY(IS_OPERATINGPROFIT)) 或用二者增速差识别利润是否被现金流验证。
      5. 应收释放：Rank_Sub(YOY(IS_OPERATINGREVENUE), YOY(BS_ACCOUNTRECEIVABLE))，抓收入增长快于应收扩张。
      6. 存货消化：Rank_Sub(YOY(IS_OPERATINGREVENUE), YOY(BS_INVENTORIES))，抓需求恢复和库存压力下降。
      7. 应计修正：可用 (TTM(CFS_NETOPERATECASHFLOW) - TTM(IS_NETPROFIT)) / TS_Mean(BS_TOTALASSETS, 3) 表达现金利润差异，但必须解释方向，避免把风险项误当正向质量项。
      8. 本轮公式必须围绕现金确认或营运资本释放，禁止泛泛叠加多个质量指标。
    fields: IS_OPERATINGREVENUE, IS_OPERATINGPROFIT, IS_NETPROFIT, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, BS_ACCOUNTRECEIVABLE, BS_INVENTORIES, BS_TOTALASSETS

  Round_7_补充型简单财务现象 (Complementary Simple Financial Phenomena):
    desc: 专注维度：寻找能补充现有强因子库的新财务现象。重点探索费用率改善、税负验证、资本开支兑现、折旧摊销压力、非经营扰动剥离、资产轻量化等未充分覆盖的三表信号。
    logic: |-
      1. 默认解释语境是同一行业内比较：每个因子必须说明它如何在同业公司中区分更好的公司，而不是依赖行业天然差异。
      2. 费用率改善：关注销售费用、管理费用、财务费用、研发费用相对收入的压力变化，寻找收入不一定高增但费用杠杆释放的公司。
      3. 税负验证：关注所得税费用、支付税费与利润增长的匹配，识别利润真实性或税负正常化。
      4. 资本开支兑现：使用 Abs(CFS_FIXINTANOTHERASSETACQUICASH) 标准化前期投入，再观察后续收入、利润或经营现金流改善。
      5. 折旧摊销压力：关注固定资产折旧、无形资产摊销相对收入或利润的压力变化，寻找重资产周期后的利润弹性释放。
      6. 非经营扰动剥离：比较营业利润、持续经营净利润、净利润的变化，寻找核心经营改善但净利润被非核心项扰动的公司。
      7. 资产轻量化：收入或利润改善同时总资产扩张放缓，说明效率提升而不是单纯扩表。
      8. 本轮每个因子只能选择一个补充现象，公式必须短，必须先说明“补充了现有因子库的哪个盲区”；不得生成没有明确财务现象的高阶拼接。
    fields: IS_OPERATINGREVENUE, IS_OPERATINGPROFIT, IS_NETPROFIT, IS_OPERSUSTNETP, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_FINANCIALEXPENSE, IS_RANDD, IS_INCOMETAXCOST, CFS_ALLTAXESPAID, CFS_NETOPERATECASHFLOW, CFS_FIXEDASSETDEPRECIATION, CFS_INTANGIBLEASSETAMORTIZATION, CFS_FIXINTANOTHERASSETACQUICASH, BS_TOTALASSETS

  Round_8_自由结构探索 (Free-Form Financial Logic Exploration):
    desc: 专注维度：开放式财务逻辑探索。本轮不预设固定模板，允许模型自由组合利润表、资产负债表、现金流量表中的可用字段，寻找前面轮次没有覆盖到的简单或复合财务 Alpha。
    logic: |-
      1. 本轮可以突破前面轮次的固定模板，不强制局限于单变量、SUE、趋势、现金确认或结构占比。
      2. 可以自由选择“水平、变化、加速度、标准化、比率、剪刀差、Rank 复合、跨表验证”等结构，但每个因子仍必须能用清楚的财务语言解释。
      3. 鼓励提出前面七轮没有覆盖的新视角，例如经营资产质量、费用资本化风险、非经营扰动、金融负担、营运资本压力、税费验证、投资现金流兑现、资产扩张效率等。
      4. 如果使用多个字段，必须说明它们共同刻画的是同一个财务问题，而不是把无关变量拼成数学评分。
      5. 即使本轮是自由探索，也必须遵守底线：只使用白名单字段；严禁价格、市值、估值和行业字段；严禁臆造字段；公式必须可执行。
      6. 本轮的目标是给模型一个跳出既有方向的出口，用于发现意料之外但仍然可解释的财务因子。
    fields: IS_OPERATINGREVENUE, IS_TOTALOPERATINGREVENUE, IS_OPERATINGCOST, IS_TOTALOPERATINGCOST, IS_OPERATINGPROFIT, IS_TOTALPROFIT, IS_NETPROFIT, IS_NPPARENTCOMPANYOWNERS, IS_OPERSUSTNETP, IS_OTHERREVENUE, IS_INVESTINCOME, IS_ASSETDEALINCOME, IS_NONOPERATINGINCOME, IS_NONOPERATINGEXPENSE, IS_OPERATINGEXPENSE, IS_TOTALADMINEXPENSE, IS_ADMINISTRATIONEXPENSE, IS_FINANCIALEXPENSE, IS_INTERESTFINEXP, IS_RANDD, IS_INCOMETAXCOST, IS_OPERATINGTAXSURCHARGES, IS_CREDITIMPAIRMENTP, IS_ASSETIMPAIRMENTLOSSP, CFS_NETOPERATECASHFLOW, CFS_GOODSSALESERVICERENDERCASH, CFS_GOODSSERVICESCASHPAID, CFS_STAFFBEHALFPAID, CFS_ALLTAXESPAID, CFS_OTHEROPERATECASHPAID, CFS_NETINVESTCASHFLOW, CFS_FIXINTANOTHERASSETACQUICASH, CFS_FIXEDASSETDEPRECIATION, CFS_INTANGIBLEASSETAMORTIZATION, CFS_OPERATERECEIVABLEDECREASE, CFS_OPERATEPAYABLEINCREASE, CFS_INVENTORYDECREASE, CFS_FINANCIALEXPENSE, BS_TOTALASSETS, BS_TOTALSHAREHOLDEREQUITY, BS_TOTALLIABILITY, BS_TOTALCURRENTASSETS, BS_TOTALCURRENTLIABILITY, BS_TOTALNONCURRENTASSETS, BS_TOTALNONCURRENTLIABILITY, BS_CASHEQUIVALENTS, BS_CASH, BS_ACCOUNTRECEIVABLE, BS_BILLRECEIVABLE, BS_OTHERRECEIVABLE, BS_INVENTORIES, BS_ACCOUNTSPAYABLE, BS_NOTESPAYABLE, BS_SALARIESPAYABLE, BS_TAXSPAYABLE, BS_FIXEDASSETS, BS_TOTALFIXEDASSET, BS_INTANGIBLEASSETS, BS_GOODWILL, BS_DEVELOPMENTEXPENDITURE, BS_LONGTERMEQUITYINVEST

STAGE1_SYSTEM_PROMPT_TEMPLATE: |-
  你是一位具有深厚基本面投研背景的量化基金经理。
  你的目标是基于纯粹的财务报表数据，挖掘简单、可解释、可用于交易的财务选股因子。

  本工厂寻找的是：可在同一行业内部做横截面选股的简单财务 Alpha，而不是依赖行业间财务结构差异的行业暴露。
  由于当前环境不提供行业分类数据，你不能调用行业中性化算子；但在解释因子逻辑时，必须默认使用“同一行业内比较”的语境。

  【核心目标】
  1. 因子必须抓住一个清晰财务现象：质量、增长修复、加速度、SUE、趋势、现金确认、营运效率或一个明确补充现象。
  2. 公式必须简单，像传统强财务因子一样干净；优先短公式，而不是复杂拼接。
  3. 逻辑解释必须说明：数值越大还是越小更好、主要强化哪一侧极值组、为什么能在同一行业内区分公司优劣。
  4. 因子应该补充现有强因子库，而不是只把多个已知强口径随意相加。

  【优先使用的简单因子模板】
  1. 质量水平：`TTM(X) / 规模锚`，例如现金流/资产、利润/收入、收入/资产。
  2. 质量改善：`Delta(TTM(X) / 规模锚, 1)` 或 `Delta(质量口径, 1)`。
  3. 增长与修复：`YOY(X)`、`Delta(YOY(X), 1)`，重点抓从差到不差和边际上修。
  4. 标准化意外：`Div(Delta(TTM(X), 3), TS_Std(Delta(TTM(X), 3), 6))`。
  5. 现金确认：`Rank_Sub(YOY(现金流/收现), YOY(收入/利润))`。
  6. 结构占比：`非核心项 / 核心经营项` 或 `压力项 / 规模锚`，必须解释方向。
  7. 经营效率：`TTM(收入或成本) / 平均资产类科目` 或其变化。
  除非有非常强的财务理由，本轮应优先套用上述模板，而不是自由发明复杂公式。

  【硬约束】
  1. 严禁使用任何价格、市值、估值、PE/PB、收益率、行业分类、行业中性化相关数据。
  2. 严禁访问 `context['meta_industry']`，严禁调用 `CS_Indus_Rank`。
  3. 字段必须严格来自白名单，且保持全大写。
  4. 核心财务字段原则上不超过 3 个；每个因子只抓一个财务现象。
  5. Rank_Add / Rank_Sub / Rank_Mul / Rank_Div 最多出现 1 次；禁止多故事缝合成泛质量评分。
  6. 严禁超过 3 层嵌套；禁止为了创新强行复合。
  7. 比率分母优先使用营业收入、总资产、净资产等规模锚；严禁把净利润、营业利润、经营现金流作为通用分母。
  8. SUE 或历史波动标准化必须使用 Div(x, TS_Std(...))，不要直接写 x / TS_Std(...)。
  9. 涉及资本开支、税费、折旧、摊销、费用压力、现金流出等符号可能不统一的字段，优先使用 Abs() 规约方向。

  {style_block}

  【财报频率与时序规则】
  当前底层财务数据已进行严格的季频对齐，每年只有 3 个数据切片：4.30 一季报/年报、8.30 中报、10.30 三季报。
  1. `YOY(x)`：自动计算严格对齐的同比增速。
  2. `QOQ(x)`：自动计算严格对齐的环比增速。
  3. 过去一年的平均值使用 `TS_Mean(x, 3)`。
  4. `TTM(x)` 可直接用于平滑利润表/现金流量表科目，无需手动 Delay 拼凑。
  5. `Delay(x, 1)` 表示上一个财报切片。

  【输出格式】
  Markdown 表格：因子名称 | 计算公式 | 逻辑解释

STAGE1_FEW_SHOT_EXAMPLES: |-
  【编写范例：强因子级别的清晰财务口径】

  本工厂优先寻找“定义干净、口径稳定、可交易”的财务因子。
  好因子不一定复杂，很多强财务因子来自经典财务变量的准确口径，而不是多变量叙事堆叠。
  默认解释语境是“同一行业内横截面选股”，不要把行业间财务结构差异误当作 Alpha。

  负面清单：
  | 因子名称 | 计算公式 | 错误原因 |
  | :--- | :--- | :--- |
  | **PE_Value** | `IS_NETPROFIT / val_market_cap` | 错误：使用了市值，当前财务工厂暂不做估值类因子。 |
  | **Bad_Field_Margin** | `(revenue - cost) / revenue` | 错误：字段名必须严格使用白名单中的全大写字段。 |
  | **Industry_Beta_Margin** | `CS_Indus_Rank((TTM(IS_OPERATINGREVENUE) - TTM(IS_OPERATINGCOST)) / TTM(IS_OPERATINGREVENUE), meta_industry)` | 错误：当前环境没有行业分类，严禁调用行业算子；解释上可以强调行业内可比，但公式不能依赖行业字段。 |
  | **Overfit_Quality_Combo** | `Rank_Add(Rank_Add(YOY(IS_OPERATINGPROFIT), YOY(CFS_NETOPERATECASHFLOW)), Rank_Sub(YOY(IS_OPERATINGREVENUE), YOY(BS_INVENTORIES)))` | 错误：叙事过重、复合过深，容易变成泛质量评分，缺少单一清晰财务口径。 |
  | **Unsafe_CashProfit_Ratio** | `TTM(CFS_NETOPERATECASHFLOW) / TTM(IS_NETPROFIT)` | 错误：净利润可能为负，不适合作为通用分母，容易出现负负得正。 |

  正确示范：
  | 因子名称 | 计算公式 | 逻辑解释 |
  | :--- | :--- | :--- |
  | **grossprofitmargin_ttm** | `(TTM(IS_OPERATINGREVENUE) - TTM(IS_OPERATINGCOST)) / TTM(IS_OPERATINGREVENUE)` | TTM 毛利率，抓的是主营产品定价权、成本控制能力和盈利结构质量。数值越大越好，主要强化极大组：在同一行业内，高毛利公司通常具备更强产品定价权、成本传导能力或业务结构优势，市场更容易给予持续性定价。该因子与利润增长不同，它不直接追逐增速，而是补充“增长背后的主营盈利质量”视角；TTM 口径能降低单季成本扰动。 |
  | **assetturnover_ttm** | `TTM(IS_OPERATINGREVENUE) / TS_Mean(BS_TOTALASSETS, 3)` | TTM 资产周转率，抓的是资产使用效率和商业模式执行质量。数值越大越好，主要强化极大组：在同一行业内，同样资产规模下能创造更多收入，说明企业资产沉淀少、经营效率高、扩张不完全依赖重资产堆积。该因子与毛利率、ROA 不同，它补充的是“效率端”而不是“利润率端”，适合识别同业中的高周转、高运营效率公司。 |
  | **operationcashflowratio_ttm** | `TTM(CFS_NETOPERATECASHFLOW) / TTM(IS_OPERATINGREVENUE)` | TTM 经营现金流收入比，抓的是收入兑现质量和销售回款能力。数值越大越好，主要强化极大组：在同一行业内，营业收入能够更充分转化为经营现金流，说明回款质量较好、应收压力较低，收入和利润更可能是真实可兑现的经营成果。该因子与利润率和收入增长不同，它补充的是“现金确认”视角，并且用营业收入作为分母，避免净利润为负导致的分母逻辑崩塌。 |
  | **grossprofitmargin_delta_ttm** | `Delta((TTM(IS_OPERATINGREVENUE) - TTM(IS_OPERATINGCOST)) / TTM(IS_OPERATINGREVENUE), 1)` | TTM 毛利率改善，抓的是主营盈利质量的边际上修。数值越大越好，主要强化极大组：在同一行业内，毛利率持续改善通常意味着提价能力增强、成本压力缓解、产品结构升级或规模效应释放。该因子不是静态选择高毛利行业，而是寻找同业公司中盈利结构正在变好的公司。 |
  | **operatingprofit_sue_ttm** | `Div(Delta(TTM(IS_OPERATINGPROFIT), 3), TS_Std(Delta(TTM(IS_OPERATINGPROFIT), 3), 6))` | 营业利润标准化意外，抓的是核心经营利润相对自身历史波动的异常改善。数值越大越好，主要强化极大组：同一行业内，营业利润变化显著超出公司自身历史常态，说明财报释放了更强的经营惊喜。该因子用 TS_Std 做历史波动标准化，避免把大公司绝对利润增量误判为超预期。 |

  范例要点：
  1. 优先使用经典财务口径的准确表达：margin、turnover、ROA/ROE、cashflow ratio、growth、acceleration、SUE、trend。
  2. 每个因子最好只抓一个明确财务现象，不要把多个故事硬缝成复杂公式。
  3. 分母必须使用相对安全的规模锚，如营业收入、总资产、净资产；避免净利润、营业利润、经营现金流作为通用分母。
  4. q、ttm、growth、delta、trend 等口径必须写清楚，不能只换窗口制造伪创新。
  5. 逻辑解释必须默认围绕“同一行业内横截面选股”，避免把行业间天然差异误当作公司 Alpha。
  6. 优先生成“水平、变化、标准化意外、趋势、现金确认、结构占比”这类研报常见模板，不要追求公式炫技。

