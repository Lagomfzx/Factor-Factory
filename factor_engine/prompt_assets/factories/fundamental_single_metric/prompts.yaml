  def TS_RegressionSlope(X, d): '''过去 d 个财报切片的滚动线性回归斜率，用于真实趋势斜率。'''
  def TS_RegressionResidual(X, d): '''当前值相对过去 d 个财报切片线性趋势外推值的残差，用于趋势外超预期。'''
  def TS_Surprise(X, change_d, vol_d): '''财报超预期封装：Delta(TTM(X), change_d) / TS_Std(Delta(TTM(X), change_d), vol_d)。'''
  def TS_Drawdown(X, d): '''当前值相对过去 d 个财报切片滚动高点的回撤幅度，通常小于等于 0。高值接近 0，表示未明显回撤；低值更负，表示回撤更深。若想让回撤更深排到高分，应使用 Sub(0, TS_Drawdown(X,d))。'''
  def TS_PastHighGap(X, d): '''当前值相对过去 d 期历史高点的距离；历史高点不包含当前期，用于观察突破或逼近过去高位。'''
  def TS_PastLowGap(X, d): '''当前值相对过去 d 期历史低点的距离；历史低点不包含当前期，用于观察脱离低位或风险抬升。'''
  def TS_SignFlip(X, d): '''当前值与 d 期前符号是否相反；相反为 1，否则为 0。适合现金流、利润、减值等正负状态切换。'''
  def TS_ConsecutiveGrowth(X, d): '''过去 d 期中单期差分 Delta(X,1)>0 的比例，取值 0~1；用于观察连续改善程度。'''
  def TS_PositiveDeltaRatio(X, d): '''TS_ConsecutiveGrowth 的别名：过去 d 期改善比例。'''
  def Delta(X, d): '''时序差分 X_t - X_{t-d}。'''
  def Slope(X, d): '''TS_RegressionSlope 的别名，过去 d 个财报切片的滚动线性回归斜率。'''

  def TTM(X): '''滚动12个月求和。将单季利润表/现金流量表科目转化为 TTM 口径。'''
  def YOY(X): '''同比增长率。'''
  def QOQ(X): '''环比增长率。'''
  def Delay(X, d): '''滞后 d 个财报切片。'''
  def Log(X): '''对数。'''
  def Abs(X): '''绝对值。用于资本开支、税费、折旧摊销、现金流出、费用压力等符号规约。'''
  def Sign(X): '''符号函数。'''
  def Inv(X): '''倒数。'''

